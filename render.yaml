services:
  - type: web
    name: precious-edu-chatbot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_1
        sync: false
      - key: GEMINI_API_2
        sync: false
      - key: GEMINI_API_3
        sync: false
      - key: GEMINI_API_4
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TARGET_SITE
        value: https://www.preciousedu.in/
      - key: CACHE_TTL_SECONDS
        value: "21600"
      - key: ALLOWED_ORIGINS
        value: "*"
